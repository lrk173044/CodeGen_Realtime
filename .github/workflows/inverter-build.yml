name: Inverter example build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build/inverter-system-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove previous build
        run: cmake -E rm -rf "$BUILD_DIR"

      - name: Configure
        run: cmake -S examples/inverter_system -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install numpy matplotlib

      - name: Run simulation
        run: "$BUILD_DIR/simulate_inverter"

      - name: Generate plots and validation
        run: python "$BUILD_DIR/plot.py"

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp "$BUILD_DIR/results/"* site/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Three-phase Inverter Simulation Results</title>
            <style>
              body {
                max-width: 960px;
                margin: 2rem auto;
                padding: 0 1rem;
                color: #20252b;
                font: 16px/1.5 system-ui, sans-serif;
              }
              img {
                display: block;
                width: 100%;
                height: auto;
              }
              nav {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                margin-bottom: 2rem;
              }
              section {
                margin: 2rem 0;
              }
            </style>
          </head>
          <body>
            <h1>Three-phase Inverter Simulation Results</h1>
            <p>
              50 Hz reference, 100 kHz triangular carrier, 50 ns time step,
              1 s simulation duration.
            </p>
            <nav>
              <a href="inverter.csv">Download inverter CSV</a>
              <a href="spwm.csv">Download SPWM CSV</a>
              <a href="validation.json">View validation data</a>
            </nav>
            <section>
              <h2>Filtered three-phase output voltages</h2>
              <img src="inverter_voltage.png" alt="Filtered three-phase output voltages">
            </section>
            <section>
              <h2>SPWM reference, carrier, and gate signals</h2>
              <img src="inverter_spwm.png" alt="SPWM reference, carrier, and gate signals">
            </section>
          </body>
          </html>
          EOF

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: inverter-simulation-results
          path: build/inverter-system-build/results/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
