name: Shipboard example build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_DIR: build/shipboard-system-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove previous build
        run: cmake -E rm -rf "$BUILD_DIR"

      - name: Configure
        run: >
          cmake -S examples/shipboard_system_two_leg
          -B "$BUILD_DIR"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install numpy matplotlib

      - name: Run Fig.16 and Fig.19 simulations
        run: "$BUILD_DIR/simulate_pi"

      - name: Generate plots and validation
        run: python "$BUILD_DIR/plot_paper.py"

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: shipboard-simulation-results
          path: build/shipboard-system-build/results/
          if-no-files-found: error
