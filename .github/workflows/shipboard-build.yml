name: Shipboard example build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_DIR: build/shipboard-system-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove previous build
        run: cmake -E rm -rf "$BUILD_DIR"

      - name: Configure
        run: >
          cmake -S examples/shipboard_system_two_leg
          -B "$BUILD_DIR"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install numpy matplotlib

      - name: Run Fig.16 and Fig.19 simulations
        run: "$BUILD_DIR/simulate_pi"

      - name: Generate plots and validation
        run: python "$BUILD_DIR/plot_paper.py"

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp "$BUILD_DIR/results/"* site/

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Two-leg Shipboard Simulation Results</title>
            <style>
              body {
                max-width: 1040px;
                margin: 2rem auto;
                padding: 0 1rem;
                color: #20252b;
                font: 16px/1.5 system-ui, sans-serif;
              }
              img {
                display: block;
                width: 100%;
                height: auto;
                margin-bottom: 2rem;
              }
              nav {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                margin-bottom: 2rem;
              }
              section {
                margin: 3rem 0;
              }
              .note {
                padding: 1rem;
                border-left: 4px solid #84102c;
                background: #f8f4f5;
              }
            </style>
          </head>
          <body>
            <h1>Two-leg Shipboard Simulation Results</h1>

            <p class="note">
              Accelerated variant: 1 us time step and 10 kHz PWM.
              The original paper specification used 50 ns and 100 kHz.
            </p>

            <nav>
              <a href="fig16.csv">Download Fig.16 CSV</a>
              <a href="fig19.csv">Download Fig.19 CSV</a>
              <a href="fig19_control.csv">Download PI control CSV</a>
              <a href="validation.json">View validation data</a>
            </nav>

            <section>
              <h2>Fig.16 - DC bus voltage reduction</h2>
              <img src="fig16_dc_bus.png"
                   alt="DC bus voltage reduction at 0.5 seconds">
            </section>

            <section>
              <h2>Fig.19 - PI voltage reduction</h2>
              <img src="fig19_pi_voltage.png"
                   alt="Inverter PI voltage-amplitude reduction at 10.133 seconds">
            </section>
          </body>
          </html>
          EOF

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: shipboard-simulation-results
          path: build/shipboard-system-build/results/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
